name: peis-local
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peis
      MYSQL_USER: peis
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u peis -D peis -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  app:
    image: peis:local
    build: .
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9280
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: peis
      DB_USER: peis
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      OA_ENABLED: "false"
      DINGTALK_ENABLED: "false"
      ZIXIN_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-9280}:9280"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9280/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  mysql-data:
